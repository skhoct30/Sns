<!DOCTYPE html>
<html lang="ko"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">

	<section layout:fragment="contents" class="contents">
		
		<div class="pt-5"></div>
		
		<div class="container input-box pt-5 mt-5">

			<div class="card shadow-sm rounded py-3">
				
			    <div class="d-flex justify-content-between align-items-center py-2 px-3">
					<h3>게시물 작성</h3>
					<a href="/post/timeline-view" class="btn btn-outline-secondary">목록으로</a>
			    </div>
			    <div class="px-3 mt-3">
					<textarea class="form-control" rows="30" placeholder="내용을 입력하세요. . ." id="contentsInput"></textarea>
				</div>
				<div class="px-3 mt-4 d-flex justify-content-between">
					<input type="file" class=" mt-3" id="fileInput">
					<button type="button" class="btn text-white" style="background-color: #405DE6; width:100px;" id="saveBtn">공유하기</button>
				</div>
				
				
			
			</div>
			
		</div>
	
	</section>
	
	<script layout:fragment="script">
		$("#saveBtn").on("click", function(){
			
			let contents = $("#contentsInput").val();
			let file = $("#fileInput")[0].files[0];
			
			if(contents == "") {
				alert("내용을 입력하세요");
				return;
			}
			
			//파일 저장기능
			let formData = new FormData();
			formData.append("contents", contents);
			formData.append("imageFile", file);
			
			
			$.ajax({
				type:"post"
				, url:"/post/create"
				, data:formData
				, enctype:"multipart/form-data"
				, processData:false
				, contentType:false
				, success:function(response) {
					if(response.result == "success") {
						location.href = "/post/timeline-view"
					} else {
						alert("글 작성 실패!");
					}
				}
				, error:function() {
					alert("글 작성 오류!");
				}
			
			})
			
			
			
		})
	
	
	</script>
